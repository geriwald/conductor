[project]
name = "conductor"
version = "0.1.0"
description = "Let your AI agents choose your music, and answer them with your keyboard's media keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ytmusicapi>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
conductor = "conductor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
